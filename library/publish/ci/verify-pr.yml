# Proposed workflow: the library's check of a publish pull request (lane G,
# T3.3). Lanes do not edit .github/; integration copies this file to
# .github/workflows/verify-publish.yml (plans/parallel/tk_lane_G.md,
# Requests for integration).
#
# The pull request's files are data. The code that checks them comes from the
# base branch, checked out apart, so a pull request that edits
# library/publish/verify.ts cannot change its own check. `pull_request` (not
# `pull_request_target`): a read-only token and no secrets reach the run. The
# author's login reaches the script through an environment variable, never
# through `${{ }}` inside a script (GitHub's script injection guidance).
name: verify-publish

on:
  pull_request:
    paths: ["library/catalog/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: the base branch's code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: the pull request's files, as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        working-directory: base
      - name: verify each changed entry
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git -C pr fetch -q --depth 1 origin "$BASE_SHA"
          # Folder names are a stranger's text (security finding W2-S1,
          # integration w2): read one per line, never word-split; every changed
          # path must sit inside an entry folder named by the library's id
          # pattern; anything else in the catalog (brands.json, sets.json, the
          # README) needs a human review, so the check fails on it; the ids go
          # after "--", where the command line takes no flag.
          mapfile -t paths < <(git -C pr diff --name-only "$BASE_SHA" HEAD -- library/catalog)
          if [ "${#paths[@]}" -eq 0 ]; then echo "no entry changed"; exit 0; fi
          ids=()
          for p in "${paths[@]}"; do
            rest=${p#library/catalog/}
            id=${rest%%/*}
            if [ "$rest" = "$id" ] || ! [[ "$id" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
              echo "a changed catalog path is not inside an entry folder; a change there needs a human review:" >&2
              printf '  %q\n' "$p" >&2
              exit 1
            fi
            ids+=("$id")
          done
          mapfile -t ids < <(printf '%s\n' "${ids[@]}" | sort -u)
          node --no-warnings base/library/publish/cli.ts verify --pr pr --base base --author "$PR_AUTHOR" -- "${ids[@]}"
