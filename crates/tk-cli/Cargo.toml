# This manifest is shared by lanes C and D in wave 1 and lane J in wave 2.
# Each lane edits only the lines under its own `# [lane-X]` comment, in any
# table, and pins every dependency to an exact version
# (plans/parallel_build_tk.md, section 2, point 5). A section ends at the
# next marker or the next table header. Everything else is session 0's and
# changes only through integration. scripts/lane-scope.mjs checks this.

[package]
name = "tk-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "tk: connect, run, watch"

[[bin]]
name = "tk"
path = "src/main.rs"

[features]
default = []
# [lane-C]
# [lane-D]
# [lane-J]

[dependencies]
tk-core = { path = "../tk-core" }
serde.workspace = true
serde_json.workspace = true
# Shared by lanes C and D since integration w1 (lane D's request 6).
libc.workspace = true
# [lane-C]
# Format-preserving TOML edits for Codex's config.toml: comments and key
# order survive a write. Reason and pin in the lane C status doc.
toml_edit = "=0.25.17"
sha2.workspace = true
# [lane-D]
# `tk run`: the daemon socket client (lane D's own crate) and chat and event
# ids (uuid, the workspace's exact pin).
tk-audit-linux = { path = "../tk-audit-linux" }
uuid.workspace = true
# [lane-J]

[dev-dependencies]
# [lane-C]
# [lane-D]
# [lane-J]
