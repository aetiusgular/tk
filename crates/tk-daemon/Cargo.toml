[package]
name = "tk-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "tk watch: the OTLP receiver, the activity log, the socket server"

[[bin]]
name = "tk-daemon"
path = "src/main.rs"

[features]
default = []
# The fork's otel_receiver/ and activity/ as copied. They still reference
# `tauri::` in three files (see NOTICE); lane B replaces those and moves the
# modules out from behind this flag. `cargo check --features fork-modules`
# shows what is left.
fork-modules = []
# The fork's computer_use/ as copied. Lane K wires it in wave 2.
computer-use = ["fork-modules"]

[dependencies]
tk-core = { path = "../tk-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
uuid.workspace = true
toml.workspace = true
base64.workspace = true
