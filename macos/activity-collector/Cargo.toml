# The activity collector (wave 3, lane B): a root launchd daemon around
# /usr/bin/eslogger. Its own workspace and lock file, so it never touches the
# app's. macOS only at run time; its logic is tested in the cloud against
# recorded eslogger JSON.
[package]
name = "monocode-activity-collector"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
flate2 = "=1.1.9"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
